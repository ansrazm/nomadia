# Satu perintah: docker compose up --build
# Salin .env.example menjadi .env di folder ini lebih dulu (kredensial iPaymu & secret n8n).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nomadia
      POSTGRES_PASSWORD: nomadia
      POSTGRES_DB: nomadia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadia -d nomadia"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      PORT: "4000"
      DATABASE_URL: postgres://nomadia:nomadia@db:5432/nomadia
      CORS_ORIGINS: http://localhost:3000,https://nomadia.dragonstorepb.com
      # Alamat yang bisa dijangkau iPaymu. Di laptop, isi URL tunnel (mis. ngrok) agar callback sampai.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      IPAYMU_VA: ${IPAYMU_VA:-}
      IPAYMU_API_KEY: ${IPAYMU_API_KEY:-}
      IPAYMU_MODE: ${IPAYMU_MODE:-sandbox}
      IPAYMU_DEBUG: ${IPAYMU_DEBUG:-false}
      IPAYMU_FLOW: ${IPAYMU_FLOW:-redirect}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/nomadia-order-paid
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?isi N8N_WEBHOOK_SECRET di .env (minimal 16 karakter)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Login pelanggan (kode 6 digit lewat email). Aktif bila CUSTOMER_AUTH_SECRET diisi (minimal 32 karakter, beda dari AUTH_SECRET).
      # SMTP bawaannya Mailpit di compose ini: kodenya bisa dibaca di http://localhost:8025.
      CUSTOMER_AUTH_SECRET: ${CUSTOMER_AUTH_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Nomadia <no-reply@nomadia.local>}
      # Asisten chat AI (opsional). Kosong = panel chat memakai FAQ statis. Lihat .env.example.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CHAT_GLOBAL_PER_HOUR: ${CHAT_GLOBAL_PER_HOUR:-300}
      # Pembatasan laju per IP. Di belakang Cloudflare Tunnel / Nginx / Caddy isi TRUST_PROXY_HOPS=1 (jumlah proxy tepercaya).
      RATE_LIMIT: ${RATE_LIMIT:-on}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    environment:
      # Server web membaca katalog lewat jaringan Docker. NEXT_PUBLIC_API_URL hanya untuk browser.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Jakarta
      # Workflow contoh memverifikasi tanda tangan di node Code: butuh modul crypto dan akses $env.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # Notifikasi Telegram ke pemilik toko (opsional; kosong = dilewati).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - mailpit
    ports:
      - "5678:5678"

  # SMTP palsu untuk demo: email konfirmasi dari n8n tidak keluar ke internet, tapi bisa dibaca di http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  # ---- Konten editorial (profil "content"): docker compose --profile content up --build ----
  # Strapi menyimpan panduan + FAQ; Astro membangun situs statis dari sana. Katalog, harga, dan pesanan tetap di api/ (Hono).
  cms-db:
    profiles: ["content"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${CMS_DB_PASSWORD:-strapi}
      POSTGRES_DB: strapi
    volumes:
      - cms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 3s
      timeout: 3s
      retries: 20

  cms:
    profiles: ["content"]
    build: ./cms
    depends_on:
      cms-db: { condition: service_healthy }
    environment:
      HOST: 0.0.0.0
      PORT: "1337"
      APP_KEYS: ${CMS_APP_KEYS:-}
      API_TOKEN_SALT: ${CMS_API_TOKEN_SALT:-}
      ADMIN_JWT_SECRET: ${CMS_ADMIN_JWT_SECRET:-}
      TRANSFER_TOKEN_SALT: ${CMS_TRANSFER_TOKEN_SALT:-}
      ENCRYPTION_KEY: ${CMS_ENCRYPTION_KEY:-}
      JWT_SECRET: ${CMS_JWT_SECRET:-}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: cms-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${CMS_DB_PASSWORD:-strapi}
      CORS_ORIGINS: ${SITE_URL:-http://localhost:4399}
      # Webhook ke penyaji situs dibuat otomatis oleh Strapi saat start.
      SITE_REBUILD_URL: http://site:4399/__rebuild
      SITE_REBUILD_SECRET: ${SITE_REBUILD_SECRET:-}
    volumes:
      - cms_uploads:/app/public/uploads
    ports:
      - "1337:1337"

  site:
    profiles: ["content"]
    build: ./site
    depends_on:
      - cms
    environment:
      PORT: "4399"
      STRAPI_URL: http://cms:1337
      REBUILD_SECRET: ${SITE_REBUILD_SECRET:-}
      SITE_URL: ${SITE_URL:-http://localhost:4399}
      # Tujuan tombol "Beli": storefront Next.js. Ikut tertanam di HTML saat build.
      STORE_URL: ${STORE_URL:-http://localhost:3000}
    ports:
      - "4399:4399"

volumes:
  pgdata:
  n8n_data:
  cms_pgdata:
  cms_uploads:
