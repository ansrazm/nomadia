name: CI

on:
  push:
    branches: [main, content-layer]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ---- Hono API: tipe + tes dengan PostgreSQL sungguhan ----
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomadia
          POSTGRES_PASSWORD: nomadia
          POSTGRES_DB: nomadia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nomadia -d nomadia_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nomadia:nomadia@localhost:5432/nomadia_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ---- FastAPI fulfillment ----
  fulfillment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fulfillment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fulfillment/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # ---- Next.js storefront ----
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ---- Astro (dibangun dari fixture, tanpa CMS) ----
  site:
    runs-on: ubuntu-latest
    env:
      STRAPI_URL: ""
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # ---- Strapi: build panel admin ----
  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---- n8n: pemeriksaan statis (bukan eksekusi) + validasi compose ----
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Workflow n8n (JSON, koneksi, sintaks node Code)
        run: node scripts/check-n8n-workflow.mjs
      - name: Docker Compose valid di semua profil
        env:
          N8N_WEBHOOK_SECRET: ci-secret-0123456789
        run: |
          docker compose config -q
          docker compose --profile content --profile fulfillment config -q

  # ---- Alur eSIM lintas layanan: PostgreSQL + API + FastAPI (n8n diganti penerima palsu) ----
  e2e-fulfillment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomadia
          POSTGRES_PASSWORD: nomadia
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nomadia" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fulfillment/requirements.txt
      - run: npm ci
        working-directory: api
      - run: pip install -r fulfillment/requirements.txt
      - run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - run: bash scripts/e2e-fulfillment.sh
        timeout-minutes: 8

  # ---- Semua image Docker harus bisa dibangun (tidak di-push) ----
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, cms, site, fulfillment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
